[package]
name = "codrawithm-api"
version = "0.1.0"
edition = "2021"
authors = ["Codrawithm Contributors"]
description = "Codrawithm backend API and real-time collaboration server"

[dependencies]
axum = { version = "0.7.5", features = ["ws", "macros", "multipart"] }
tokio = { version = "1.37.0", features = ["full"] }
tower = { version = "0.4.13", features = ["util"] }
tower-http = { version = "0.5.2", features = ["cors", "trace", "fs"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
sqlx = { version = "0.7.4", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
uuid = { version = "1.8.0", features = ["serde", "v4"] }
chrono = { version = "0.4.38", features = ["serde"] }
dotenvy = "0.15.7"
thiserror = "1.0.61"
anyhow = "1.0.86"
jsonwebtoken = "9.3.0"
argon2 = { version = "0.5.3", features = ["std"] }
rand = "0.8.5"
futures-util = "0.3.30"
futures = "0.3.30"

[dev-dependencies]
tower = { version = "0.4.13", features = ["util"] }
http-body-util = "0.1.1"
